; PlatformIO Project Configuration for ESP32-S3-BOX-3
; Information Management System (IMS) Hardware Voice Client

[env:esp32s3box]
; Switched from the official "espressif32" registry entry (frozen on the old
; Arduino-ESP32 2.x core / ESP-IDF 4.4, which never included the i2s_std
; driver used to test the mic-static theory) to the pioarduino community
; fork, the de facto successor since Espressif and platformio.org parted
; ways - this pins Arduino-ESP32 3.3.11 (ESP-IDF 5.x), which does.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32s3box
framework = arduino
monitor_speed = 115200

; CPU and Flash settings for ESP32-S3-BOX-3 (16MB Flash, 8MB Octal PSRAM)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = default_16MB.csv

build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_ESP32_S3_BOX
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1

; No WebSockets library - we speak raw TCP with a simple framed protocol
; instead (see config.h), since Links2004/WebSockets hard-caps messages at
; 15KB and Gemini's real messages run well past that.
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    lovyan03/LovyanGFX @ ^1.1.12
